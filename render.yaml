# Render Blueprint. Secrets are `sync: false` (entered in the dashboard, never in git)
# or generated by Render.
services:
  - type: web
    name: llm-gateway
    runtime: node
    plan: free
    region: singapore
    # --include=dev: NODE_ENV=production would otherwise skip typescript.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Free instances get a fixed 30s shutdown window (maxShutdownDelaySeconds is paid-only),
    # so REQUEST_DEADLINE_MS stays below 30s and in-flight requests settle before SIGKILL.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.21.0"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
